name: Build and publish iOS plugin

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/deploy-ios-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ios/package-lock.json
      - name: Install dependencies
        working-directory: ios
        run: npm install
      - name: Build plugin
        working-directory: ios
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ios/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
